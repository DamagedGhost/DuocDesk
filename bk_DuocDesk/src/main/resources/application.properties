spring.application.name=DuocDesk

# --- Configuración de Oracle Wallet ---

# 1. Ubicación de la Wallet (Corregido a 'classpath:')
#    Spring buscará la carpeta 'Wallet_DuocDesk' dentro de 'src/main/resources'
spring.datasource.wallet_location=classpath:Wallet_DuocDesk

# 2. Credenciales (Las que ya tenías)
spring.datasource.username=admin
spring.datasource.password=vXJzsDyKLB5P8N6

# 3. URL de Conexión (¡Esto es nuevo!)
#    Usa el TNS_ADMIN para apuntar a la wallet y especifica el alias de 'tnsnames.ora'
#    Estoy usando 'duocdesk_low' como ejemplo, basado en tu tnsnames.ora
spring.datasource.url=jdbc:oracle:thin:@duocdesk_low?TNS_ADMIN=${spring.datasource.wallet_location}

# 4. Driver (Opcional, pero buena práctica)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver